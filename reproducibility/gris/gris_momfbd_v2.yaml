# MOMFBD configuration for the CRISP 630 nm scans of 2026-10-06 (SAC "gris" dataset), version 2.
#
# Identical to gris_momfbd.yaml (the first full run) except for the noise model of the Wiener
# filter (filter_noise_shape / filter_noise_flat of both objects). Why, in short (details and
# numbers in README.md, tuning in gris_tune.py and tuning/summary/):
#
#   * The first run left a fine worm-like noise texture over both channels in the worst-seeing
#     bursts (science2, steps ~31-40). The Wiener filter calibrates the noise level beyond the
#     diffraction cutoff ([0.9, 1.45] of it) and 'white' assumes that level everywhere. The
#     destretch applied before MOMFBD interpolates the frames, which removes noise only above
#     ~0.85 of the cutoff (measured: the white model then underestimates the noise power by x1.45
#     where the signal is), and in bad seeing that lets noise through.
#   * The interpolation is also uneven over the field: torchmfbd's warp samples a zero flow at an
#     offset running from -0.5 px at one edge to +0.5 px at the other, so the noise is smoothed
#     little at the centre and strongly near the edges (variance kept 1.0 centre, 0.69 edge, 0.53
#     corner). No single noise shape fits every patch.
#   * 'auto' measures the noise shape from the patches. Its default holds the shape flat below
#     0.25, where real signal contaminates the measurement and over-smooths good seeing. Holding it
#     flat below 0.70 was chosen with a split-burst test (even vs odd frames, 5 steps, 13 settings,
#     three independent judges and an adversarial check, on a central 768 px crop): in the worst
#     steps the noise drops ~3-15x and stays at or below the reproducible signal, while good-seeing
#     steps keep ~90 % of their reproducible mid-band detail. 0.85 (the value matching the
#     field-averaged noise transfer) still let noise through in edge patches. Narrower cutoffs and
#     fewer modes did not remove the texture. Even with 0.70 the outer corners of the 1408 px field
#     keep part of the noise in science2's worst steps (README).
#
# This is hifi_momfbd.yaml (the configuration validated on HiFI+ H-alpha bursts, see the
# comments there for why each value is what it is) with only the optics and the patch size
# changed to this instrument. The driver gris_momfbd.py forces every patch to the on-disk
# regime, so the off-limb settings of the HiFi file are not needed and were removed.

telescope:
    diameter: 144.0               # GREGOR, same telescope as HiFI+
    central_obscuration : 40.0

images:
    # 128 px at 0.032"/px is 4.1", the same angular patch as the validated 96 px at 0.0462"
    # on HiFI+, and it keeps the pupil sampled over 45 px (34 px with 96 px here). The driver
    # uses patch_size 128 and stride 64: with the 20 px apodization border cropped from every
    # patch edge, neighbouring patches still overlap by 24 px, the HiFi overlap rule, and a
    # 1024 px crop tiles exactly into 15 x 15 patches. The KL basis for this size is computed
    # once on the first run and cached in basis/ next to the scripts (do not run from the hifi
    # directory: its basis/ cache is keyed without the pixel size and would be reused wrongly).
    n_pixel : 128
    pix_size : 0.032              # arcsec/px, both cameras (Thomas Berkefeld, 9 Oct 2026)
    apodization_border : 20
    remove_gradient_apodization : True

# object1 is the broad band (BB, 0.95 ms exposures), object2 the narrow band (NB, 9.5 ms).
# Both get the same wavelength: the scan covers 6300.3-6303.4 A, a 0.05 % range that changes
# nothing in the pupil or the frequency grid, and one value means one shared basis for both
# objects and for every step. The cutoffs are the HiFi on-disk wideband values, used for both
# channels here (HiFi's NB used [0.50, 0.65]); the Wiener filter
# weights each frequency by the signal-to-noise measured in the patch, so the NB does not need
# a narrower band a priori. If the line-core steps come out grainy, narrow the NB cutoff to
# [0.50, 0.65] and/or lower psf/nmax_modes (see hifi_momfbd.yaml for the reasoning).
object1:
    wavelength : 6302.0
    image_filter: scharmer
    cutoff : [0.70, 0.85]             # [full transmission, taper end], in units of the diffraction cutoff
    filter_mode : wiener
    filter_threshold : 0.3
    filter_noise_band : [0.9, 1.45]   # beyond the diffraction cutoff; the data are sampled out to 1.41
    filter_noise_shape : auto         # v2: measured noise shape instead of white (see the header)
    filter_noise_flat : 0.70          # v2: shape held flat below 0.70 of the cutoff
    s_u_joint : 100.0

object2:
    wavelength : 6302.0
    image_filter: scharmer
    cutoff : [0.70, 0.85]
    filter_mode : wiener
    filter_threshold : 0.3
    filter_noise_band : [0.9, 1.45]
    filter_noise_shape : auto
    filter_noise_flat : 0.70
    s_u_joint : 100.0

optimization:
    gpu : -1                      # overridden by the driver's --gpu
    transform : softplus
    softplus_scale : 1.0
    lr_obj : 0.02
    lr_modes : 0.05
    lr_prior : 0.2
    loss_type: joint

regularization:
    # Only active with deconvolve(infer_object=True); the driver runs with infer_object=False.
    iuwt1:
        variable : object
        lambda : 0.001
        nbands : 5

psf:
    model : kl
    nmax_modes : 44               # what the disk can constrain without fitting noise (hifi_momfbd.yaml)
    jitter : none

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.0
    end_pct : 0.6

priors:
    K:
        mean: 10.0
        sigma: 1.0
    v0:
        mean: 0.1
        sigma: 1.0
    p:
        mean: 2.0
        sigma: 1.0
